# Exact, immutable Aurora kernel inputs for the aurora Apple Silicon payload.
#
# Only the aurora product reads this file; the Asahi lane never does. Pin it
# from the aurora-packages-<sha> release that
# omarchy-pkgs/.github/workflows/release-aurora-package.yml publishes, then
# point the [omarchy-aurora] repository in
# configs/airootfs/usr/share/omarchy-iso/pacman-online-installed-arm-aurora.conf
# at the same release.

AURORA_REPOSITORY_RELEASE=PENDING
AURORA_REPOSITORY_DESCRIPTOR_SHA256=PENDING
AURORA_REPOSITORY_SOURCE_COMMIT=PENDING
AURORA_REPOSITORY_SIGNING_FINGERPRINT=CAB18E175BFB9ACCE185234474DE0C737AC186E4
AURORA_REPOSITORY_PACKAGE_COUNT=2
