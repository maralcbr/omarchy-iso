[options]
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Temporary hold: freeze the Aurora kernel against pacman upgrades so a machine
# running a locally-patched linux-aurora (dcpext2/3 external-display support) is
# not reverted by `pacman -Syu` / `omarchy update`. Install still resolves
# linux-aurora from [omarchy-aurora] below. Remove this once the patched kernel
# is published and [omarchy-aurora] is re-pinned at that aurora-packages release.
IgnorePkg = linux-aurora linux-aurora-headers

# The signed Aurora kernel and compatible m1n1 bootloader. Keep this
# repository first so the Aurora boot packages resolve together.
[omarchy-aurora]
SigLevel = Required DatabaseOptional
Server = https://github.com/maralcbr/omarchy-pkgs/releases/download/aurora-packages-1c5e34c99dc2510bf06c673165a79aa92c8f1f4c

[omarchy]
SigLevel = Required DatabaseOptional
Server = https://github.com/maralcbr/omarchy-pkgs/releases/download/asahi-packages-stable-83973903b7deb9b56ce75f02b432fba0561d6293

[asahi-alarm]
SigLevel = Required DatabaseOptional
Server = https://github.com/asahi-alarm/asahi-alarm/releases/download/aarch64

[core]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
