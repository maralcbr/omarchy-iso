# The Arch Linux ARM repositories below are a dated, immutable copy in our own
# bucket, not the live mirrors: a live mirror mid-transition (one package
# rebuilt against a new library, its dependents not yet) makes the payload
# unbuildable for as long as the transition lasts. See
# omarchy-mx-mac/docs/apple-silicon-distribution-channels.md, "The Arch Linux
# ARM snapshot". Installed systems keep using the live mirrors.
[options]
HoldPkg = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[arm-snapshots]
SigLevel = Required DatabaseOptional
Server = file:///var/cache/airootfs/var/cache/omarchy/mirror/offline

[core]
Server = https://downloads.aicodelabs.com.au/mirror/alarm/20260910/$repo/os/$arch

[extra]
Server = https://downloads.aicodelabs.com.au/mirror/alarm/20260910/$repo/os/$arch

[alarm]
Server = https://downloads.aicodelabs.com.au/mirror/alarm/20260910/$repo/os/$arch

[aur]
Server = https://downloads.aicodelabs.com.au/mirror/alarm/20260910/$repo/os/$arch
